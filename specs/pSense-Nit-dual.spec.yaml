id:            pSense-Nit-dual
version:       4                        # v4 2026-07-05: RBS_sfGFP_med INTAKEN — S4 (ACAAAGGACAAATACTAG, OSTIR TIR 725, 0.51x B0034 in true PyeaR context) sealed to library; Stage-1 unblocked. Adds PyeaR-junction trim rule (uORF hazard). v3: role-based RBS (sfGFP=MEDIUM pending). v2 both-weak build quarantined. [BUILD 2026-07-05: Stages 3-6 executed — insert v2 (4106 bp, seq_sha256 f93cd7517077) assembled+validated(PASS)+diffed(all 5 deltas confirmed); Stage-5 = SEALED (2026-07-05): sfGFP variant ratified (BBa_I746916) + lacZ-RBS sealed as one designed part RBS_lacZ_weak (B0032 core + TACTA spacer). insert seq_sha256 f93cd7517077 unchanged. No design change → version stays 4.]
track:         acoustic
purpose:       "nitrate dose-response, DUAL readout: PyeaR → sfGFP (Accuri/fluorescence) + lacZ (752G/ONPG A420 colorimetric). Single-input characterisation sensor (NarL chromosomal). Bicistron: sfGFP then lacZ. NOTE host: read lacZ in a lacZ- host (DH5alpha) — MG1655 is lac+ and endogenous beta-gal swamps ONPG."
host:          E_coli_MG1655            # cloning/design chassis; COLORIMETRIC assay must run in DH5alpha (lacZ-, recA-)
backbone:      { vector: pTwist_Chlor_MediumCopy, ori: p15A, marker: CmR }
assembly:      { method: null, decide_with: assembly-strategy-advisor }
vendor:        Twist
constraints:
  fragment_bp_max: 5000                 # Twist <=5 kb/fragment; dual insert ~4120 bp (backbone-stripped) < cap → one piece
  forbid_sites:    [EcoRI, XbaI, SpeI, PstI, NdeI, BsaI, BbsI]
  host_context:    E_coli_MG1655        # off-target scanned against this genome (Stage-4 blastn PASS, see vault note)
  output_gate:     acoustic-only

parts:                                  # DISTINCT parts; architecture.order gives the left→right sequence (with reuse)
  - id: PyeaR
    role: promoter
    class: reference
    variant: nitrate-inducible
    source: { db: NCBI, accession: NC_000913.3, coords: "1879946-1880107", strand: "-" }
    seal:   { status: SEALED, lib: "PyeaR__v1__33b534f79945.gb", seq_sha256_12: 33b534f79945, length: 162 }
  - id: RBS_sfGFP_med
    role: rbs
    class: designed
    variant: medium
    source: { note: "MEDIUM-TIR RBS for the sfGFP VISUAL cistron (07-04h). OSTIR-designed, rung S4 (SD-core AGGACA). TIR 725 a.u. = 0.51x B0034 in TRUE PyeaR CLEAN context (local OSTIR 1.1.3/ViennaRNA-2.7.2, 2026-07-05)." }
    seal:   { status: SEALED, lib: "designed/acoustic/RBS_sfGFP_med__v1__4fb6162d1eb2.gb", seq_sha256_12: 4fb6162d1eb2, length: 18, note: "S4 = ACAAAGGACAAATACTAG, RBS->ATG spacing 7." }
  - id: RBS_lacZ_weak
    role: rbs
    class: designed
    variant: weak
    parent: B0032
    design_record: { derivation: "B0032 core (BBa_B0032, TCACACAGGAAAG, 13nt) + 5nt TACTA spacer = 18nt functional unit", tool: manual-spacer, host: E_coli, version: 1 }
    seal:   { status: SEALED, lib: "designed/acoustic/RBS_lacZ_weak__v1__e6d8ab8d6247.gb", seq_sha256_12: e6d8ab8d6247, length: 18 }
  - id: sfGFP
    role: reporter
    class: reference
    variant: superfolder
    source: { registry: iGEM, part: BBa_I746916 }
    seal:   { status: SEALED, lib: "sfGFP__v1__08a1e654bd76.gb", seq_sha256_12: 08a1e654bd76, length: 720 }
  - id: lacZ
    role: reporter
    class: reference
    variant: beta-galactosidase
    source: { db: NCBI, accession: NC_000913.3, coords: "363231-366305", strand: "-" }
    seal:   { status: SEALED, lib: "lacZ__v1__b6be24d3d83b.gb", seq_sha256_12: b6be24d3d83b, length: 3075 }
  - id: B0015
    role: terminator
    class: reference
    variant: double
    source: { registry: iGEM, part: BBa_B0015 }
    seal:   { status: SEALED, lib: "B0015__v1__696c73e5a7a8.gb", seq_sha256_12: 696c73e5a7a8, length: 129 }
  - id: p15A
    role: ori
    class: reference
    source: { db: NCBI, accession: X06403, coords: "581-1493", strand: "+" }
    seal:   { status: SEALED, lib: "p15A__v1__252795606a1d.gb", seq_sha256_12: 252795606a1d, length: 913 }
  - id: cat
    role: marker
    class: reference
    variant: CmR
    source: { db: NCBI, accession: V00622, coords: "244-903", strand: "+" }
    seal:   { status: SEALED, lib: "cat__v1__3416e882d5b8.gb", seq_sha256_12: 3416e882d5b8, length: 660 }

architecture:
  order:          [PyeaR, RBS_sfGFP_med, sfGFP, RBS_lacZ_weak, lacZ, B0015]   # insert scope (07-04f). RBS_sfGFP_med=S4 MEDIUM (sealed); RBS_lacZ_weak=B0032 core+TACTA spacer sealed as one designed unit (2026-07-05), lacZ cistron only. p15A+cat = Twist vendor vector, referenced via backbone:, NOT in insert seal scope
  topology:       linear-insert          # insert cassette delivered into Twist vendor vector (final plasmid is circular in the vector)
  trims:                                 # machine-readable trims consumed by katana_build.py (v2 2026-07-05)
    PyeaR:
      3prime: AGGAGGGAAAAGGATG          # 16 nt native SD+ATG — MUST trim for clean junction (uORF hazard; OSTIR-verified 2026-07-05)
  junction_rules:
    - "RBS→ATG spacing 5-9 nt (both cistrons)"
    - "no spurious internal ATG/stop across junctions"
    - "PyeaR→RBS_sfGFP_med junction: TRIM PyeaR's native SD+ATG (3' 16 nt 'aggagggaaaaggatg') so the ONLY RBS driving sfGFP is RBS_sfGFP_med. If retained, OSTIR shows a strong uORF start at the PyeaR ATG (2194 a.u. w/ B0034; 4691 a.u. w/ S2) that collapses sfGFP TIR (S2 1219→448). Verified local OSTIR 2026-07-05."
    - "clean bicistronic junction: sfGFP stop → RBS → lacZ ATG, no read-through artefact"
    - "no forbidden RE site across any junction"

