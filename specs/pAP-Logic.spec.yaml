    class: reference
    variant: orthogonal
    source: { db: Cello_UCF, ucf: "Eco1C1G1T1", ref: "Chen 2013 (Voigt) terminator set", note: "orthogonal strong terminator; module-1 (lldR) terminator, diversifies away from B0015 to break the 3x-B0015 direct repeat + its RecA recombination liability." }
    seal:   { status: SEALED, lib: "ECK120033736__v1__26dc56560cae.gb", seq_sha256_12: 26dc56560cae, length: 53 }
  - id: L3S2P55
