    design_record: { tool: optimize-codons, engine: DNAChisel, host: E_coli, version: 3 }
    pin:    "HrpS.Ec-opt@v3@5093ea792057"
    seal:   { status: SEALED, lib: "designed/acoustic/HrpS.Ec-opt__v3__5093ea792057.gb", seq_sha256_12: 5093ea792057, length: 909, note: "v3 = DNAChisel CONSTRAINED optimum (supersedes v2 cc3f6c1ec6ef): CodonOptimize(e_coli) s.t. AvoidMatches(HrpR,15) + EnforceTranslation + AvoidPattern(forbidden RE) + 5' pinned. protein-IDENTICAL (303 aa, hard-enforced); real E.coli CAI 0.963 (v1 0.821, v2 0.766); max HrpR shared 14bp (hard-broken); RE-CLEAN incl. removed pre-existing internal PstI@633; 5' preserved (RBS_hrpS v2 TIR 13441)." }
  - id: ECK120033736
