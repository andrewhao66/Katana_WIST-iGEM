architecture:
  order:          [J23116, RBS_lldR_strong, lldR, ECK120033736, ALPaGA, RBS_hrpR, HrpR.Ec-opt, L3S2P55, PyeaR, RBS_hrpS, HrpS.Ec-opt, B0015]   # insert scope only; p15A+cat = Twist vendor vector (backbone). 3 modules with DISTINCT terminators: J23116->RBS_lldR_strong->lldR->ECK120033736 (repressor, v8 STRONG RBS @v3 TIR 19023 for clean OFF, repeat-broken) | ALPaGA->RBS_hrpR->HrpR->L3S2P55 (lactate arm) | PyeaR(trimmed)->RBS_hrpS->HrpS->B0015 (nitrate arm, terminal).
  topology:       linear-insert
  trims:                                 # machine-readable trims consumed by katana_build.py
    PyeaR:
      3prime: AGGAGGGAAAAGGATG          # 16 nt native SD+ATG trim (same as Nit) -- clean PyeaR->RBS_hrpS junction, removes uORF hazard (OSTIR-confirmed)
  junction_rules:
    - "RBS->ATG spacing 5-9 nt (all three cistrons)"
    - "no spurious internal ATG/stop across junctions"
    - "RBS_hrpR->HrpR.Ec-opt: NdeI-clean (RBS_hrpR v2 AACAA breaks the v1 AACAT CATATG)"
    - "PyeaR->RBS_hrpS: TRIM PyeaR native SD+ATG (3' 16 nt AGGAGGGAAAAGGATG) -- uORF hazard, OSTIR-confirmed"
    - "terminator junctions (lldR->ECK120033736, HrpR->L3S2P55, HrpS->B0015): no forbidden RE across the junction; terminators are forward-oriented (terminate the upstream CDS)"
    - "no forbidden RE site across any junction (KpnI internal to L3S2P55 is allowed; not forbidden)"

