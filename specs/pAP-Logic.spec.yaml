id:            pAP-Logic
version:       8                        # v8 2026-08-27: REPEAT FIX (order-readiness). v7's RBS_lldR_strong v2 (WIST+AGGAGGT+AACATAA) was byte-identical to RBS_hrpS v2 -> a 43bp exact direct repeat in the insert (>40bp recA-substrate threshold; Twist repeat-flag risk). v8 -> RBS_lldR_strong v3 (WIST+GAGGAGGT+TACAAA, OSTIR TIR 19023 in lldR ctx, SAME ~19k clean-OFF strength) whose only overlap with hrpR/hrpS is the 25bp shared WIST leader -> longest insert repeat drops 43->~32bp (baseline). Single-part swap vs v7 (39->39 bp, seq differs). Supersedes v7.
                                        # v7 2026-08-27: 19k clean-OFF (RBS_lldR_strong v2, 19266) - SUPERSEDED by v8 (v2 collided with RBS_hrpS -> 43bp repeat).
                                        # v6 2026-08-27: CLEAN-OFF fix. B0032 (weak ~172) -> RBS_lldR_strong v1 (13272, matched activator tier). Insert 3491->3516. Fixed the P2 lactate leak (under-expressed LldR). Supersedes v5.
                                        # v5 2026-07-06: HrpS.Ec-opt v2->v3 (DNAChisel CONSTRAINED optimum; real E.coli CAI 0.766->0.963, HrpR homology 15->14bp, RE-CLEAN, protein-identical). 909bp, insert 3491bp.
track:         acoustic
purpose:       "lactate AND nitrate sigma54 AND-gate LOGIC layer: J23116->lldR (LldR repressor); ALPaGA(lactate, LldR-repressed)->HrpR; PyeaR(nitrate)->HrpS. Both sigma54 activators (HrpR+HrpS) required to fire P_hrpL on the paired pAP-Report-dual / pAP-Output construct. Reporter-free by design (2-plasmid AND-gate)."
host:          E_coli_MG1655            # BCRC Taiwan chassis for Acoustic lab work
backbone:      { vector: pTwist_Chlor_MediumCopy, ori: p15A, marker: CmR }
assembly:      { method: single_fragment, decided: "2026-07-06", note: "insert 3491 bp < 5 kb Twist cap -> one clonal gene into pTwist_Chlor_MediumCopy; no Gibson/split. Internal RE sites (incl. L3S2P55 KpnI) irrelevant to de-novo synthesis (only junction-crossing forbidden sites gate)." }
vendor:        Twist
constraints:
  fragment_bp_max: 5000                 # Twist <=5 kb/fragment; insert 3491 bp < cap -> single piece
  forbid_sites:    [EcoRI, XbaI, SpeI, PstI, NdeI, BsaI, BbsI]
  host_context:    E_coli_MG1655        # off-target scanned against this genome; Stage-4 blastn RE-SCAN must include the 2 new terminators
  output_gate:     acoustic-only

parts:                                  # DISTINCT parts; architecture.order gives the left->right sequence (with reuse)
  - id: J23116
    role: promoter
    class: reference
    variant: constitutive-weak
    source: { registry: iGEM, part: BBa_J23116 }
    seal:   { status: SEALED, lib: "J23116__v1__d2a88442f986.gb", seq_sha256_12: d2a88442f986, length: 35 }
  - id: RBS_lldR_strong
    role: rbs
    class: designed
    variant: strong
    parent: null
    design_record: { tool: design-rbs, engine: OSTIR, target_TIR: 19023, host: E_coli, version: 3 }
    pin:    "RBS_lldR_strong@v3@5284a57eb9f9"
    seal:   { status: SEALED, lib: "designed/acoustic/RBS_lldR_strong__v3__5284a57eb9f9.gb", seq_sha256_12: 5284a57eb9f9, length: 39, note: "lldR slot -- STRONG, REPEAT-BROKEN (v3, WIST+GAGGAGGT+TACAAA sp6, OSTIR TIR 19023 in lldR context = same ~19k clean-OFF strength as v2). Supersedes v2 (WIST+AGGAGGT+AACATAA, TIR 19266) which was byte-identical to RBS_hrpS v2 -> 43bp direct repeat >40bp recA threshold. v3 max overlap vs hrpR/hrpS = 25bp (WIST leader baseline) -> longest insert repeat ~32bp. NdeI/forbidden-clean at the lldR ATG junction (spacer ends AA, not CAT)." }
  - id: lldR
    role: cds
    class: reference
    variant: lactate-repressor
    source: { db: NCBI, accession: NC_000913.3, coords: "3779054-3779830", strand: "+" }
    seal:   { status: SEALED, lib: "lldR__v1__8b1b37ebeb6c.gb", seq_sha256_12: 8b1b37ebeb6c, length: 777 }
