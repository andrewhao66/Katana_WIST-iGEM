architecture:
  order:          [J23116, RBS_lldR_strong, lldR, B0015, ALPaGA, RBS_lacZ_weak, lacZ, B0015]   # insert scope only; p15A+cat = Twist vendor vector (backbone, already in hand). v2 vs v1 = single-part swap at the lldR RBS (B0032 13 bp -> RBS_lldR_strong v3 39 bp).
  topology:       linear-insert
  trims: {}                              # no trims required (ALPaGA sealed at 352 bp with 3' at deposit RBS-start 1196 = no native SD+ATG to trim; PyeaR n/a in Lac)
  junction_rules:
    - "RBS->ATG spacing 5-9 nt (lldR via RBS_lldR_strong v3, lacZ via RBS_lacZ_weak)"
    - "RBS_lldR_strong->lldR ATG: NdeI-clean (spacer ends AA, not CAT)"
    - "no spurious internal ATG/stop across junctions"
    - "ALPaGA->RBS_lacZ_weak->lacZ: clean reporter junction (ALPaGA 3' at deposit RBS-start, no native SD to trim)"
    - "no forbidden RE site across any junction"
    - "v2 predicted delta vs v1: ONLY the lldR RBS locus (13->39 bp, net +26). lldR ATG onward byte-identical. ANY other delta is a STOP."

