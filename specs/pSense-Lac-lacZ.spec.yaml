id:            pSense-Lac-lacZ
version:       2                        # v2 2026-08-29: CLEAN-OFF port of Cycle 14. B0032 (weak ~172) -> RBS_lldR_strong v3 (WIST+GAGGAGGT+TACAAA, OSTIR TIR 19023 in lldR ctx) — SAME part + pin as pAP-Logic v8, so the standalone lactate characterisation sensor matches the AND-gate repressor. Insert 4528->4554 (+26). Surgical: lldR ATG onward byte-identical to v1 / shipped Twist insert. Build route = in-place inverse-PCR + Gibson of the in-hand p15A/CmR plasmid (Twist credit exhausted; IDT stock vector is high-copy pUCIDT, wrong for a tuned sensor). Supersedes v1.
                                        # v1 2026-07-05: DERIVED from pSense-Lac-dual v2 by dropping the sfGFP cistron. Single lacZ (752G/ONPG) readout. Insert 4528 bp. SHIPPED Twist Shipment 1 (COA on file; order ids live in the inventory + intake records, not in a Spec); leaky because lldR sat on B0032.
spec_hash:     7d172708e1d3ae43eef72924ad4d5ecc63098d18ebd49ede5c0cbea15127ef8c   # SHA-256 of INTENT (id..architecture; spec_hash line + records excluded; LF-normalized UTF-8)
track:         acoustic
purpose:       "lactate dose-response, SINGLE lacZ readout, CLEAN OFF: J23116->RBS_lldR_strong(v3)->lldR (LldR repressor at AND-gate-matched ~19k TIR); ALPaGA(lactate, LldR-repressed) -> lacZ (752G/ONPG A420 colorimetric). Characterisation sensor 'pSense-Lac-LacZ' v2. HOST: read lacZ in lacZ- DH5alpha (MG1655 is lac+ -> endogenous beta-gal swamps ONPG). Testable claim: OFF leak drops vs v1 and ON recovers a >=3x lactate dose-response (the P2 v1 run was flat/high-leak)."
host:          E_coli_MG1655            # cloning/design chassis; COLORIMETRIC assay must run in DH5alpha (lacZ-, recA-, still lldR+)
backbone:      { vector: pTwist_Chlor_MediumCopy, ori: p15A, marker: CmR }   # already in hand (shipped v1 plasmid); v2 is an in-place RBS edit of this backbone, not a new Twist order
assembly:      { method: inverse_pcr_gibson, decided: "2026-08-28", note: "in-place edit of shipped pSense-Lac-lacZ (p15A/CmR, 6481 bp): inverse PCR deletes B0032; DpnI; DF100 gel-extract; Gibson HiFi a 125-bp IDT gBlock (J23116 arm + RBS_lldR_strong v3 + lldR arm). Result plasmid 6507 bp. Insert 4554 bp still < 5 kb Twist cap but Twist credit is exhausted (190 bp) so this is NOT a resynthesis." }
vendor:        IDT
constraints:
  fragment_bp_max: 5000                 # insert 4554 bp < cap (informational; the ordered piece is a 125-bp gBlock, not the insert)
  forbid_sites:    [EcoRI, XbaI, SpeI, PstI, NdeI, BsaI, BbsI]
  host_context:    E_coli_MG1655        # off-target scanned against this genome (Stage-4 blastn; lldR/ALPaGA/lacZ byte-exact to Lac-dual / v1 parts -> inherited PASS except the new RBS locus)
  output_gate:     acoustic-only

